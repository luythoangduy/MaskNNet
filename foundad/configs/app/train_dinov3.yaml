# @package app
meta:
  model: 'dinov3'
  crop_size: 512
  pred_depth: 6
  pred_emb_dim: 384
  use_bfloat16: false
  if_pred_pe: false
  n_layer: 3
  feat_normed: false
  loss_mode: 'l2'  # l2 or smooth_l1
  synthesis_mode: 'neural_mask'  # neural_mask or cutpaste
  synth_probability: 0.5
  synthetic_weight: 2.0
  use_channel_routing: false
  channel_topk: 32
  channel_score_momentum: 0.9
  use_channel_ema: true
  use_channel_stability: false
  use_masked_channel_reliability: true
  feature_synth_mode: 'mixed'  # dropout, noise, replacement, shuffle, mixed
  feature_synth_alpha: 1.0
  token_mask_mode: 'rectangle'  # rectangle, random_blob, random_tokens
  token_mask_min_ratio: 0.05
  token_mask_max_ratio: 0.25
  use_channel_weighted_loss: false
  lambda_selected: 1.0
  lambda_background_preservation: 0.0
  lambda_delta_contrastive: 0.0
  delta_contrastive_temperature: 0.2
  synthesis:
    area_ratio: [0.02, 0.25]
    aspect_ratio: 0.3
    method: 'suppress'  # suppress or violate
    radius: 2
    pca_dim: 5
    channel_topk_ratio: 0.1
    channel_min: 32
    mask_strength: 1.0

logging:
  folder: logs/${data.data_name}/${app.meta.model}${oc.select:diy_name,""}
  write_tag: train
